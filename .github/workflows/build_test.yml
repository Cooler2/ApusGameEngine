name: Engine5 CI

on:
  push:
    branches: [ engine5 ]
  pull_request:
    branches: [ engine5 ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  base-tests:
    name: Base Tests (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: linux
            runner: ubuntu-latest
          - os_name: windows
            runner: windows-latest
          - os_name: macos-arm64
            runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install FPC (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc
          fpc -iV

      - name: Install FPC (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          winget install --id FreePascal.FreePascalCompiler -e --silent --accept-package-agreements --accept-source-agreements
          $fpcDirs=@(
            "$env:ProgramFiles\FreePascal\3.2.2\bin\x86_64-win64",
            "$env:ProgramFiles\FreePascal\3.2.2\bin\i386-win32",
            "$env:ProgramFiles(x86)\FreePascal\3.2.2\bin\x86_64-win64",
            "$env:ProgramFiles(x86)\FreePascal\3.2.2\bin\i386-win32",
            "C:\FPC\3.2.2\bin\x86_64-win64",
            "C:\FPC\3.2.2\bin\i386-win32"
          )
          foreach($dir in $fpcDirs){
            if(Test-Path (Join-Path $dir "fpc.exe")){
              $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:PATH="$dir;$env:PATH"
              break
            }
          }
          where.exe fpc
          fpc -iV

      - name: Install FPC (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install fpc
          fpc -iV
          fpc -iTP
          fpc -iTO

      - name: Build Base modules (Linux)
        if: runner.os == 'Linux'
        run: bash Base/tests/buildtest.sh

      - name: Build Base modules (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: Base\tests\buildtest.bat

      - name: Build Base modules (macOS)
        if: runner.os == 'macOS'
        run: bash Base/tests/buildtest.sh

      - name: Run Base tests (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          tests=(Core Conv Strings Types Containers HashMaps GlyphCache Files EventMan Threads Tweenings Geom2D Geom3D Spatial GfxFilters TCP HttpServer)
          for t in "${tests[@]}"; do
            echo "::group::Base test $t"
            bash Base/tests/test.sh "$t"
            echo "::endgroup::"
          done

      - name: Run Base tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          @echo on
          for %%T in (Core Conv Strings Types Containers HashMaps GlyphCache Files EventMan Threads Tweenings Geom2D Geom3D Spatial GfxFilters TCP HttpServer) do (
            call Base\tests\test.bat %%T || exit /b 1
          )

      - name: Run Base tests (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          tests=(Core Conv Strings Types Containers HashMaps GlyphCache Files EventMan Threads Tweenings Geom2D Geom3D Spatial GfxFilters TCP HttpServer)
          for t in "${tests[@]}"; do
            echo "::group::Base test $t"
            bash Base/tests/test_macos.sh "$t"
            echo "::endgroup::"
          done

      - name: Upload Base test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: base-tests-${{ matrix.os_name }}
          path: |
            Base/tests/buildtest_results.txt
            Base/tests/test_results_64.txt
            Base/tests/test_results_32.txt
            Base/tests/test_results_L64.txt
            Base/tests/test_results_M64.txt
          if-no-files-found: warn

  demo-build:
    name: Demo Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: linux
            runner: ubuntu-latest
          - os_name: windows
            runner: windows-latest
          - os_name: macos-arm64
            runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install FPC (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # SDL2 + SDL2_mixer: the audio backend is enabled by default on desktop (defines.inc)
          sudo apt-get install -y fpc libsdl2-dev libsdl2-mixer-dev
          fpc -iV

      - name: Install FPC (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          winget install --id FreePascal.FreePascalCompiler -e --silent --accept-package-agreements --accept-source-agreements
          $fpcDirs=@(
            "$env:ProgramFiles\FreePascal\3.2.2\bin\x86_64-win64",
            "$env:ProgramFiles\FreePascal\3.2.2\bin\i386-win32",
            "$env:ProgramFiles(x86)\FreePascal\3.2.2\bin\x86_64-win64",
            "$env:ProgramFiles(x86)\FreePascal\3.2.2\bin\i386-win32",
            "C:\FPC\3.2.2\bin\x86_64-win64",
            "C:\FPC\3.2.2\bin\i386-win32"
          )
          foreach($dir in $fpcDirs){
            if(Test-Path (Join-Path $dir "fpc.exe")){
              $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:PATH="$dir;$env:PATH"
              break
            }
          }
          where.exe fpc
          fpc -iV

      - name: Install FPC (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install fpc
          fpc -iV

      - name: Compile selected demos (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          compile_demo() {
            local demo="$1"
            local dpr="demo/${demo}/${demo}.dpr"
            local out="demo/${demo}/_fpc"
            rm -rf "$out"
            mkdir -p "$out"
            fpc -dOPENGL -MDelphi -Sd -RIntel \
              -Fu. -Fuextra -Fuextra/sdl2 -FuBase -FuBase/extra \
              -Fu"demo/${demo}" -FU"$out" "$dpr"
          }
          compile_demo "SimpleDemo"
          compile_demo "Draw2D"
          compile_demo "InputDemo"
          compile_demo "TextDemo"
          compile_demo "Simple3D"
          compile_demo "ShadowMap"
          compile_demo "SoundDemo"

      - name: Compile selected demos (Windows)
        if: runner.os == 'Windows'
        run: |
          $demos=@("SimpleDemo","Draw2D","InputDemo","TextDemo","Simple3D","ShadowMap","SoundDemo")
          foreach($demo in $demos){
            $out="demo/$demo/_fpc"
            if(Test-Path $out){ Remove-Item $out -Recurse -Force }
            New-Item -ItemType Directory -Path $out | Out-Null
            fpc -dOPENGL -MDelphi -Sd -RIntel `
              -Fu. -Fuextra -Fuextra/sdl2 -FuBase -FuBase/extra `
              -Fu"demo/$demo" -FU"$out" "demo/$demo/$demo.dpr"
            if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          }

      - name: Sound smoke (Linux, dummy audio device)
        if: runner.os == 'Linux'
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          set -uo pipefail
          cd demo/SoundDemo
          ./SoundDemo 5 w300 1 w800 2 w1500 check:music 4 w300
          sound_exit=$?
          echo '--- SoundDemo.log ---'
          if [[ -f SoundDemo.log ]]; then cat SoundDemo.log; else echo 'SoundDemo.log not found'; fi
          exit "$sound_exit"

      - name: Sound smoke (Windows, dummy audio device)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          $targetCPU=(fpc -iTP).Trim()
          if($targetCPU -eq "x86_64"){
            $runtimeDir="bin64"
          }elseif($targetCPU -eq "i386"){
            $runtimeDir="bin"
          }else{
            throw "Unsupported Windows FPC target: $targetCPU"
          }
          $runtimeDlls=@(
            (Join-Path $runtimeDir "sdl2.dll"),
            (Join-Path $runtimeDir "SDL2_mixer.dll"),
            (Join-Path $runtimeDir "libxmp.dll")
          )
          Write-Host "Using $runtimeDir audio runtime for FPC target $targetCPU"
          Copy-Item -LiteralPath $runtimeDlls -Destination demo\SoundDemo -Force
          Set-Location demo\SoundDemo
          .\SoundDemo.exe 5 w300 1 w800 2 w1500 check:music 4 w300
          $soundExitCode=$LASTEXITCODE
          Write-Host "SoundDemo exit code: $soundExitCode"
          if($soundExitCode -ne 0){ exit $soundExitCode }

      - name: Compile selected demos (macOS)
        if: runner.os == 'macOS'
        env:
          OUTDIR: tests/_demo_smoke
        run: bash tests/macos_smoke.sh demos

      - name: Upload demo build outputs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: demo-build-${{ matrix.os_name }}
          path: |
            demo/**/lib/
            demo/**/*.compiled
            demo/SoundDemo/SoundDemo.log
            tests/_demo_smoke/*.log
          if-no-files-found: ignore

  engine-tests:
    name: Engine Tests (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: linux
            runner: ubuntu-latest
          - os_name: windows
            runner: windows-latest
          - os_name: macos-arm64
            runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install FPC (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # SDL2 + SDL2_mixer: the audio backend is enabled by default on desktop (defines.inc)
          sudo apt-get install -y fpc libsdl2-dev libsdl2-mixer-dev
          fpc -iV

      - name: Install FPC (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          winget install --id FreePascal.FreePascalCompiler -e --silent --accept-package-agreements --accept-source-agreements
          $fpcDirs=@(
            "$env:ProgramFiles\FreePascal\3.2.2\bin\x86_64-win64",
            "$env:ProgramFiles\FreePascal\3.2.2\bin\i386-win32",
            "$env:ProgramFiles(x86)\FreePascal\3.2.2\bin\x86_64-win64",
            "$env:ProgramFiles(x86)\FreePascal\3.2.2\bin\i386-win32",
            "C:\FPC\3.2.2\bin\x86_64-win64",
            "C:\FPC\3.2.2\bin\i386-win32"
          )
          foreach($dir in $fpcDirs){
            if(Test-Path (Join-Path $dir "fpc.exe")){
              $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:PATH="$dir;$env:PATH"
              break
            }
          }
          where.exe fpc
          fpc -iV

      - name: Install FPC (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install fpc
          fpc -iV

      - name: Run engine smoke tests (Linux)
        if: runner.os == 'Linux'
        env:
          OUTDIR: tests/_engine_smoke
        run: bash tests/linux_smoke.sh

      - name: Run engine smoke tests (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\tests\windows_smoke.ps1 -OutDir tests\_engine_smoke

      - name: Run engine smoke tests (macOS)
        if: runner.os == 'macOS'
        env:
          OUTDIR: tests/_engine_smoke
        run: bash tests/macos_smoke.sh engine

      - name: Upload engine smoke logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: engine-tests-${{ matrix.os_name }}
          path: tests/_engine_smoke/*.log
          if-no-files-found: warn
