name: Engine5 CI

on:
  push:
    branches: [ engine5 ]
  pull_request:
    branches: [ engine5 ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare-toolchain:
    name: Prepare Toolchain (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: linux
            runner: ubuntu-latest
          - os_name: windows
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install FPC (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc
          fpc -iV

      - name: Install FPC (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install fpc --version=3.2.2 -y
          fpc -iV

  base-buildtest:
    name: Base BuildTest (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    needs: prepare-toolchain
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: linux
            runner: ubuntu-latest
          - os_name: windows
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install FPC (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc
          fpc -iV

      - name: Install FPC (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install fpc --version=3.2.2 -y
          fpc -iV

      - name: Build test (Linux)
        if: runner.os == 'Linux'
        run: bash Base/tests/buildtest.sh

      - name: Build test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: Base\tests\buildtest.bat

      - name: Upload buildtest log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: buildtest-${{ matrix.os_name }}
          path: Base/tests/buildtest_results.txt
          if-no-files-found: warn

  base-tests:
    name: Base Tests (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs: [prepare-toolchain, base-buildtest]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: linux
            runner: ubuntu-latest
          - os_name: windows
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install FPC (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc
          fpc -iV

      - name: Install FPC (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install fpc --version=3.2.2 -y
          fpc -iV

      - name: Run Base tests (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          tests=(Core Conv Strings Types Containers HashMaps Files EventMan Threads Tweenings Geom2D Geom3D Spatial)
          for t in "${tests[@]}"; do
            echo "::group::Base test $t"
            bash Base/tests/test.sh "$t"
            echo "::endgroup::"
          done

      - name: Run Base tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          @echo on
          for %%T in (Core Conv Strings Types Containers HashMaps Files EventMan Threads Tweenings Geom2D Geom3D Spatial) do (
            call Base\tests\test.bat %%T || exit /b 1
          )

      - name: Upload Base test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: base-tests-${{ matrix.os_name }}
          path: |
            Base/tests/test_results_64.txt
            Base/tests/test_results_32.txt
            Base/tests/test_results_L64.txt
          if-no-files-found: warn

  demo-build:
    name: Demo Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: [prepare-toolchain, base-buildtest]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: linux
            runner: ubuntu-latest
          - os_name: windows
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install FPC (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc
          fpc -iV

      - name: Install FPC (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install fpc --version=3.2.2 -y
          fpc -iV

      - name: Compile selected demos (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          compile_demo() {
            local demo="$1"
            local dpr="demo/${demo}/${demo}.dpr"
            local out="demo/${demo}/_fpc"
            rm -rf "$out"
            mkdir -p "$out"
            fpc -dOPENGL -MDelphi -Sd -RIntel \
              -Fu. -Fuextra -Fuextra/sdl2 -FuBase -FuBase/extra \
              -Fu"demo/${demo}" -FU"$out" "$dpr"
          }
          compile_demo "SimpleDemo"
          compile_demo "Draw2D"
          compile_demo "InputDemo"
          compile_demo "TextDemo"

      - name: Compile selected demos (Windows)
        if: runner.os == 'Windows'
        run: |
          $demos=@("SimpleDemo","Draw2D","InputDemo","TextDemo")
          foreach($demo in $demos){
            $out="demo/$demo/_fpc"
            if(Test-Path $out){ Remove-Item $out -Recurse -Force }
            New-Item -ItemType Directory -Path $out | Out-Null
            fpc -dOPENGL -MDelphi -Sd -RIntel `
              -Fu. -Fuextra -Fuextra/sdl2 -FuBase -FuBase/extra `
              -Fu"demo/$demo" -FU"$out" "demo/$demo/$demo.dpr"
            if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          }

      - name: Upload demo build outputs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: demo-build-${{ matrix.os_name }}
          path: |
            demo/**/lib/
            demo/**/*.compiled
          if-no-files-found: ignore

  engine-tests:
    name: Engine Tests Placeholder
    runs-on: ubuntu-latest
    needs: [ base-tests, demo-build ]
    if: always()
    steps:
      - name: Placeholder
        run: |
          echo "Engine tests are not available yet."
          echo "This job is reserved for future automated engine test suites."
