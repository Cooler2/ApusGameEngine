# Engine-standard FPC options: the single place that says how a program built
# on the engine is compiled. Paths are relative to the repository root, so the
# compiler must run from there - build.sh / build.cmd do that for you:
#   fpc @build.cfg [@<project>/build.cfg] -Fu<project> -FU<project>/_fpc <project>/<name>.dpr
# Used by build.sh, build.cmd, the CI workflow and tests/macos_smoke.sh.
# A project can add its own options in <project>/build.cfg (e.g. -dSDLMIX).
# Syntax: one option per line; #IFDEF/#ENDIF test target defines (WINDOWS, LINUX,
# DARWIN, CPUX86_64...); lines starting with '#' and a space are comments.

# language mode
-MDelphi
-Sd
#IFDEF CPUI386
-RIntel
#ENDIF
#IFDEF CPUX86_64
-RIntel
#ENDIF

# renderer and text (see defines.inc for the full list of defines)
-dOPENGL
-dFREETYPE

# engine source folders
-Fu.
-Fuextra
-Fuextra/sdl2
-FuBase
-FuBase/extra
